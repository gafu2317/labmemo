case_id: case01_ceramic_atelier

design:
  manipulation: "同一人物・同一希望用途を保ち、大家が熱意を判断できる情報の種類と数を段階的に増やす"
  unit: "文字数ではなく、用途・動機・既遂行行動・具体的経験・成果・継続意思という意味単位"
  nesting: "small の内容を medium が含み、medium にない詳細を large が追加する"
  authoring: "共有ケースの記事原文だけを抜粋・再配置。新しい事実は追加しない"
  caution: "情報量と情報種類は完全には分離できないため、論文では article information richness と記述する"

levels:
  small:
    label: "小：本人・用途・最低限の希望だけ"
    included_information:
      - "職業"
      - "物件の用途"
      - "活動の目的"
      - "必要な設備"
    article: |
      # 落ち着いて作品制作が続けられるアトリエ兼住居がほしい

      掲載者: 陶作家
      氏名: 藤井 ノゾミ

      ## やりたいこと

      とにかく落ち着いて作品制作をしていきたいです。そしていい作品を生み出し、作品を通して世界中の人と繋がっていきたいです。

      ## 希望する使い方

      アトリエ兼住居として一軒家を希望しています。ガス窯が置ける、煙突を設置できる小屋、はなれ、倉庫、ガレージ、工場などが必要です。アトリエははなれでも、居住スペースでも構いません。

  medium:
    label: "中：小＋動機・現在の活動・必要性"
    included_information:
      - "small の全情報"
      - "現在の制作活動"
      - "学習・制作という既遂行行動"
      - "海外注文という観測可能な反応"
      - "制作技法と必要設備の関係"
      - "作業スペースの必要性"
    article: |
      # 落ち着いて作品制作が続けられるアトリエ兼住居がほしい

      掲載者: 陶作家
      氏名: 藤井 ノゾミ

      ## やりたいこと

      とにかく落ち着いて作品制作をしていきたいです。そしていい作品を生み出し、作品を通して世界中の人と繋がっていきたいです。

      ## やりたい理由

      少しずつ海外からお声がけをいただけるようになり、これを継続し、発展させていきたいと考えています。

      ## 希望する使い方

      アトリエ兼住居として一軒家を希望しています。ガス窯が置ける、煙突を設置できる小屋、はなれ、倉庫、ガレージ、工場などが必要です。アトリエははなれでも、居住スペースでも構いません。

      ## 現在の活動

      現在は静岡県で花器を中心に制作している陶作家です。最近はメインの花器に加え、技術向上と伝統技術継承のため、常滑市と四日市市で急須作りを教わり、制作もしています。

      私の作品は焼き締めと言って、土のみで釉薬を使用せず、土の質感や色味を生かしたものが主です。それにはガス窯が使いやすく、いろいろな焚き方を試しています。試行錯誤しながら自分らしい作品を作ることが好きです。

      海外へ発送することが増えてきたため、梱包材の保管場所や梱包作業をするスペースも必要になってきました。

  large:
    label: "大：共有ケースの記事全文"
    included_information:
      - "medium 相当の情報"
      - "活動を始めた個人的原点"
      - "学習歴"
      - "本人固有の価値観"
      - "困難・負担を含む継続姿勢"
      - "地域・協力者への考え"
      - "技能・副業・趣味"
    use_shared_article: true

